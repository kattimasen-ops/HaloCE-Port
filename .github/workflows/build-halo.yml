name: Build Halo CE for M9 Pro (RK3326)

on:
  workflow_dispatch: # Erlaubt den manuellen Start über den "Run workflow" Button
  push:
    branches:
      - main # Startet automatisch bei Änderungen im main-Branch
    paths-ignore:
      - 'README.md'

jobs:
  build-haloce-rk3326:
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: 🛠️ APT-Quellen für ARM64 konfigurieren & Abhängigkeiten installieren
        run: |
          # 1. ARM64-Architektur für Cross-Compilation aktivieren
          sudo dpkg --add-architecture arm64
          
          # 2. Bestehende Host-Quellen (amd64) explizit auf amd64 festlegen
          sudo sed -i 's/Types: deb/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          
          # 3. Offizielle ports.ubuntu.com Server für ARM64-Pakete hinzufügen
          cat << 'EOF' | sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources
          Types: deb
          Architectures: arm64
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security noble-backports
          Components: main restricted universe multiverse
          EOF
          
          # 4. Paketlisten aktualisieren & Build-Tools + ARM64-Libs installieren
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git python3 ninja-build clang lld llvm cmake \
            wget zip ca-certificates pkg-config \
            crossbuild-essential-arm64 \
            libgbm-dev:arm64 libegl1-mesa-dev:arm64 libgles2-mesa-dev:arm64 \
            libdrm-dev:arm64 libx11-dev:arm64 libasound2-dev:arm64 \
            libpulse-dev:arm64 libwayland-dev:arm64 libxkbcommon-dev:arm64

      - name: 🏗️ Baue SDL3 für ARM64 aus den Quellen
        run: |
          # SDL3 Quellcode herunterladen (neuester Stand vom Main-Branch)
          git clone --depth=1 https://github.com/libsdl-org/SDL.git sdl3-src
          cd sdl3-src
          mkdir build && cd build
          
          # Cross-Compile für ARM64 und Installation in die Ubuntu-Multiarch-Systempfade
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib/aarch64-linux-gnu \
            -DCMAKE_INSTALL_INCLUDEDIR=include
            
          make -j$(nproc)
          sudo make install

      - name: 🔗 Arbeitsverzeichnis verlinken (/work)
        run: |
          # Verlinkt den GitHub Workspace nach /work, damit Skripte mit absoluten Pfaden funktionieren
          sudo ln -s $GITHUB_WORKSPACE /work

      - name: 🚀 Führe build.sh aus
        run: |
          chmod +x build.sh
          sudo -E bash build.sh

      - name: 📦 Erstelle Release-Ordner & kopiere lokale Skripte
        run: |
          mkdir -p release/haloce
          
          # 1. Kompiliertes Binary aus dem Output-Pfad kopieren
          cp /work/out/haloce.aarch64/halo_ce_rk3326 release/haloce/
          
          # 2. Lokale Start- und Steuerungs-Skripte dazulegen
          cp haloce.sh release/haloce/
          cp haloce.gptk release/haloce/
          
          # 3. Ausführrechte für die Ziel-Binaries setzen
          chmod +x release/haloce/halo_ce_rk3326
          chmod +x release/haloce/haloce.sh

      - name: 🗜️ Archiviere Build
        run: |
          cd release
          zip -r HaloCE_M9Pro_RK3326.zip haloce/

      - name: 📤 Lade Release Artifact hoch
        uses: actions/upload-artifact@v4
        with:
          name: HaloCE-M9Pro-RK3326-Build
          path: release/HaloCE_M9Pro_RK3326.zip
