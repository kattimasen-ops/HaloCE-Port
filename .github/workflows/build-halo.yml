name: Build Halo CE for M9 Pro (RK3326)

on:
  workflow_dispatch: # Erlaubt den manuellen Start über den "Run workflow" Button
  push:
    branches:
      - main # Startet automatisch, wenn du Änderungen in den main-Branch pushst
    paths-ignore:
      - 'README.md'

jobs:
  build-haloce-rk3326:
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: 🛠️ Installiere Build-Abhängigkeiten (inkl. ARM64 Ubuntu Ports)
        run: |
          # 1. ARM64 Architektur für Cross-Compilation aktivieren
          sudo dpkg --add-architecture arm64
          
          # 2. Bestehende Standard-Quellen auf die Host-Architektur (amd64) beschränken
          sudo sed -i 's/Types: deb/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          
          # 3. Spezielle ports.ubuntu.com Quellen für ARM64 hinzufügen
          cat << 'EOF' | sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources
          Types: deb
          Architectures: arm64
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security noble-backports
          Components: main restricted universe multiverse
          EOF
          
          # 4. Paketlisten updaten und ARM64-Abhängigkeiten installieren
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git python3 ninja-build clang lld llvm \
            wget zip ca-certificates pkg-config \
            crossbuild-essential-arm64 \
            libsdl3-dev:arm64 \
            libgbm-dev:arm64 libegl1-mesa-dev:arm64 libgles2-mesa-dev:arm64 \
            libdrm-dev:arm64 libx11-dev:arm64 libasound2-dev:arm64 libpulse-dev:arm64

      - name: 🔗 Arbeitsverzeichnis verlinken (/work)
        run: |
          # Das build.sh Skript erwartet die Dateien im Ordner /work.
          # Dieser Befehl linkt das GitHub-Workspace-Verzeichnis (dein Repo) nach /work.
          sudo ln -s $GITHUB_WORKSPACE /work

      - name: 🚀 Führe build.sh aus
        run: |
          # Skript ausführbar machen und mit Root-Rechten starten (notwendig für interne apt-Befehle, falls noch vorhanden)
          chmod +x build.sh
          sudo -E bash build.sh

      - name: 📦 Erstelle Release-Ordner & kopiere lokale Skripte
        run: |
          mkdir -p release/haloce
          
          # 1. Kopiere das frisch kompilierte Spiel aus dem Output-Verzeichnis der build.sh
          cp /work/out/haloce.aarch64/halo_ce_rk3326 release/haloce/
          
          # 2. Kopiere deine Start- und Steuerungs-Skripte aus dem Hauptverzeichnis deines Repos
          cp haloce.sh release/haloce/
          cp haloce.gptk release/haloce/
          
          # 3. Stelle sicher, dass die ausführbaren Dateien die korrekten Rechte haben
          chmod +x release/haloce/halo_ce_rk3326
          chmod +x release/haloce/haloce.sh

      - name: 🗜️ Archiviere Build
        run: |
          cd release
          zip -r HaloCE_M9Pro_RK3326.zip haloce/

      - name: 📤 Lade Release Artifact hoch
        uses: actions/upload-artifact@v4
        with:
          name: HaloCE-M9Pro-RK3326-Build
          path: release/HaloCE_M9Pro_RK3326.zip
